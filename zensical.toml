[project]
site_author      = "Nathaniel Starkman"
site_description = "A parts layer over wadler-lindig: one engine behind repr, str, format and markup."
site_name        = "wadler-lindig-parts"
site_url         = "https://galacticdynamics.github.io/wadler-lindig-parts"

repo_name = "GalacticDynamics/wadler-lindig-parts"
repo_url  = "https://github.com/GalacticDynamics/wadler-lindig-parts"

# Diátaxis order: learning, then doing, then looking up, then understanding.
# Each section's index.md comes first in its array, which is what
# `navigation.indexes` renders as the section landing page.
nav = [
  "index.md",
  { "Tutorials" = [
    "tutorials/index.md",
    "tutorials/your-first-formattable-type.md",
    "tutorials/teach-the-grammar-a-new-word.md",
  ] },
  { "How-to guides" = [
    "how-to/index.md",
    "how-to/make-a-type-formattable.md",
    "how-to/nest-formattable-values.md",
    "how-to/write-a-constructor-repr.md",
    "how-to/add-an-axis.md",
    "how-to/add-a-markup.md",
    "how-to/render-your-own-payload-type.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/spec-grammar.md",
    "reference/axes.md",
    "reference/registration-rules.md",
    "reference/api.md",
  ] },
  { "Explanation" = [
    "explanation/index.md",
    "explanation/why-formatting-is-one-engine.md",
  ] },
]

[project.theme]
features = [
  "navigation.indexes",  # a section's index.md becomes its landing page
  "navigation.sections", # sections appear in the left-hand navigation
  "navigation.tabs",     # the four modes as top-level tabs
  "navigation.path",     # breadcrumbs, so a reader from search sees which mode they are in
  "navigation.top",      # back-to-top button
  "content.code.copy",   # copy button on every example
  "header.autohide",     # header disappears as you scroll
]
# `toc.integrate` was removed here deliberately: it is incompatible with
# `navigation.indexes`, and section landing pages are load-bearing for a
# Diataxis tree -- they are what tells a reader which of the four modes they
# have landed in.

[project.theme.icon]
logo = "material/format-text"
repo = "fontawesome/brands/github"

# Light mode / dark mode. Default to light deliberately: it is more obvious
# about offering a toggle than a `media` query that silently matches.
[[project.theme.palette]]
accent      = "indigo"
primary     = "white"
scheme      = "default"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent      = "indigo"
primary     = "black"
scheme      = "slate"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

# Declaring any extension replaces Zensical's defaults rather than adding to
# them, so everything the pages use is listed here explicitly.
[project.markdown_extensions]
admonition                      = {}
attr_list                       = {}
md_in_html                      = {}
pymdownx.details                = {}
pymdownx.snippets.base_path     = "docs"
pymdownx.superfences            = {}
pymdownx.tabbed.alternate_style = true
tables                          = {}
toc.permalink                   = "¤"
toc.toc_depth                   = 4

# Lets a search for `register_axis` match `wadler_lindig_parts.register_axis`.
[project.plugins.search]
separator = '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

[project.plugins.mkdocstrings.handlers.python.options]
force_inspection           = true
heading_level              = 4
inherited_members          = true
members_order              = "source"
show_bases                 = false
show_if_no_docstring       = true
show_root_heading          = true
show_signature_annotations = true
show_source                = false
show_symbol_type_heading   = true
show_symbol_type_toc       = true
