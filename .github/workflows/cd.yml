name: CD

# Gated on a `v*` tag. It first ran for `v0.1.0` on 2026-11-03, publishing to
# TestPyPI and then PyPI, so trusted publishing is configured on both sides and
# a release is a tag push.
#
# The filename and the environment names below are not free choices: each
# trusted publisher is registered against `.github/workflows/cd.yml` plus one
# environment name, and a mismatch fails the upload with no useful error. Two
# publishers are needed -- one on test.pypi.org for the `testpypi`
# environment, one on pypi.org for `pypi` -- and each is registered
# separately.
#
# A release goes to TestPyPI first: `publish-pypi` needs `publish-testpypi`,
# so a package that cannot be uploaded at all fails before it reaches the
# index that matters, where a version number cannot be reused.
#
# The tag is also the version. `pyproject.toml` declares the version dynamic
# and derives it from `git describe --match v*`, so the number in the tag is
# the number published and no file in the repository names it. Two
# consequences for anyone editing this file: re-globbing or renaming the
# trigger changes *what* gets published and not only when, and `fetch-depth: 0`
# on the build job's checkout is load-bearing rather than incidental, because
# without the tags the build cannot know its own version.
#
# A version cannot be made twice, and the index does not say so. Moving a tag
# re-runs this whole path and it reports success while publishing nothing:
# measured on 2026-11-06, when `v0.2.0` was force-updated to fix a word in its
# annotated message. Run 42186814040 rebuilt the same commit, uploaded
# byte-identical files, and PyPI accepted them -- all three jobs green, and
# PyPI's upload timestamps still those of the first run. The `build` job's
# first step exists because of that; the reasoning is written there.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 3

jobs:
  build:
    name: Build & inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag is the version, and a tag can be moved. Moving one re-runs this
      # whole path and nothing objects: on 2026-11-06 `v0.2.0` was
      # force-updated to fix a word in its message, run 42186814040 rebuilt the
      # same commit, uploaded byte-identical files, and PyPI accepted them as a
      # no-op. All three jobs went green and PyPI's upload timestamps did not
      # move. A release that reports success and published nothing is worse
      # than one that fails, because only the second kind gets looked at.
      #
      # The case that run never reached is the one that matters: a tag moved to
      # a *different* commit builds different files under a version the index
      # already holds, and whatever the upload then does, the repository says
      # `v0.2.0` is one commit while the index serves an artifact built from
      # another. Nothing else here would notice.
      #
      # So this refuses both, before anything is built or uploaded. It asks
      # PyPI and not TestPyPI on purpose: a run that died between the two
      # publish jobs has already filled TestPyPI, and that retry has to be let
      # through so it can reach PyPI. A network failure here fails the release,
      # and a re-run is the fix.
      - name: Refuse to rebuild a version PyPI already has
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import json, sys, urllib.request

          version = sys.argv[1]
          with urllib.request.urlopen(
              "https://pypi.org/pypi/wadler-lindig-parts/json", timeout=30
          ) as response:
              if version in json.load(response)["releases"]:
                  print(
                      f"::error::{version} is already on PyPI. The tag is the version, "
                      "so this run would republish a released version instead of making "
                      "a new one. If the tag was moved, move it back; to release again, "
                      "tag a new version."
                  )
                  raise SystemExit(1)
          print(f"{version} is not on PyPI yet")
          PY

      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        with:
          attest-build-provenance-github: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wadler-lindig-parts
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wadler-lindig-parts
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
